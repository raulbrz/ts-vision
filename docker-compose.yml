services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - ./server/.env
    environment:
      # Path inside the container — overrides whatever server/.env has locally, so the
      # same .env used for non-Docker dev also works here unmodified.
      USERS_DB_PATH: /data/users.db
    volumes:
      - users_db:/data
    restart: unless-stopped
    expose:
      - "5000"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: ts-vision-web
    networks:
      - default
      - nginx_proxy-network
    depends_on:
      - server
    restart: unless-stopped

volumes:
  users_db:

networks:
  nginx_proxy-network:
    external: true
