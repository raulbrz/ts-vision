<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TS Vision — Upload de Timesheets</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section id="login-screen" class="login-screen" hidden>
    <form id="login-form" class="login-card">
      <h1>TS Vision</h1>
      <p class="login-hint">Entre com seu usuário e senha para acessar.</p>
      <label>
        Usuário
        <input id="login-user" type="text" autocomplete="username" required />
      </label>
      <label>
        Senha
        <input id="login-password" type="password" autocomplete="current-password" required />
      </label>
      <button type="submit" id="login-submit">Entrar</button>
      <p id="login-error" class="login-error" hidden></p>
      <a class="login-link" href="register/">Criar conta</a>
    </form>
  </section>

  <main id="app-screen" class="app" hidden>
    <header class="app-header">
      <h1>TS Vision — Upload de Timesheets</h1>
      <div class="session-info">
        <span id="session-user"></span>
        <button type="button" id="logout-button">Sair</button>
      </div>
    </header>

    <section class="model-select">
      <label for="model-select-input">Modelo de IA</label>
      <div class="model-select-row">
        <select id="model-select-input"></select>
      </div>
      <span id="model-select-status" class="model-select-status" hidden></span>
    </section>

    <section class="upload-zone">
      <div id="dropzone" class="upload-dropzone">
        <p>Arraste arquivos aqui, clique para selecionar ou cole com Ctrl+V</p>
        <p class="upload-hint">Formatos aceitos: PDF, PNG, JPG</p>
        <input
          id="file-input"
          type="file"
          multiple
          accept=".pdf,.png,.jpg,.jpeg"
          class="upload-input"
        />
      </div>

      <ul id="upload-errors" class="upload-errors" hidden></ul>

      <div id="upload-list" class="upload-list" hidden>
        <div class="upload-list-header">
          <span id="upload-count"></span>
          <button type="button" id="clear-all">Limpar tudo</button>
        </div>
        <ul id="upload-items"></ul>
      </div>

      <div class="upload-actions">
        <div class="date-range">
          <label>
            Data inicial
            <input type="date" id="date-inicio" />
          </label>
          <label>
            Data final
            <input type="date" id="date-fim" />
          </label>
        </div>
        <div class="submit-actions">
          <button type="button" id="submit-button" disabled>Enviar para OCR</button>
          <button type="button" id="cancel-button" hidden>Cancelar</button>
        </div>
      </div>

      <div id="submit-error" class="upload-errors" hidden></div>

      <ul id="status-timeline" class="status-timeline" hidden></ul>

      <div id="results" class="results" hidden>
        <div class="results-header">
          <h2>Resultado</h2>
          <div class="results-header-actions">
            <button type="button" id="download-csv">Baixar CSV</button>
            <button type="button" id="copy-csv">Copiar CSV</button>
            <button type="button" id="clear-results">Limpar resultado</button>
          </div>
        </div>
        <div class="results-table-wrapper">
          <table id="results-table"></table>
        </div>
        <div id="results-notes-wrapper" hidden>
          <h3>Pontos de atenção</h3>
          <ul id="results-notes"></ul>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
