<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TS Vision — Upload de Timesheets</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>TS Vision — Upload de Timesheets</h1>

    <section class="upload-zone">
      <div id="dropzone" class="upload-dropzone">
        <p>Arraste arquivos aqui ou clique para selecionar</p>
        <p class="upload-hint">Formatos aceitos: PDF, PNG, JPG</p>
        <input
          id="file-input"
          type="file"
          multiple
          accept=".pdf,.png,.jpg,.jpeg"
          class="upload-input"
        />
      </div>

      <ul id="upload-errors" class="upload-errors" hidden></ul>

      <div id="upload-list" class="upload-list" hidden>
        <div class="upload-list-header">
          <span id="upload-count"></span>
          <button type="button" id="clear-all">Limpar tudo</button>
        </div>
        <ul id="upload-items"></ul>
      </div>

      <div class="upload-actions">
        <div class="date-range">
          <label>
            Data inicial
            <input type="date" id="date-inicio" />
          </label>
          <label>
            Data final
            <input type="date" id="date-fim" />
          </label>
        </div>
        <button type="button" id="submit-button" disabled>Enviar para OCR</button>
      </div>

      <div id="submit-error" class="upload-errors" hidden></div>

      <div id="results" class="results" hidden>
        <h2>Resultado</h2>
        <div class="results-table-wrapper">
          <table id="results-table"></table>
        </div>
        <div id="results-notes-wrapper" hidden>
          <h3>Pontos de atenção</h3>
          <ul id="results-notes"></ul>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
