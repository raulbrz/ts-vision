server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api/ocr streams newline-delimited JSON as the pipeline runs; buffering here would
    # turn that into one delayed burst instead of live progress, and OCR+LLM calls
    # (with retry/backoff) can take a while, hence the long timeouts.
    location /api/ {
        proxy_pass http://server:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
